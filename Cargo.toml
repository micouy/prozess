[package]
name = "pz"
version = "0.0.1"
edition = "2024"
description = "Agent-friendly process manager"
license = "MIT"
repository = "https://github.com/micouy/prozess"
readme = "README.md"
keywords = ["cli", "daemon", "process", "supervisor"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "src/**",
    "tests/**",
]

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.37", features = ["derive"] }
nix = { version = "0.29.0", features = ["signal"] }
netstat2 = "0.11.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sysinfo = "0.33.1"
tokio = { version = "1.44.2", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8.23"

[dev-dependencies]
assert_cmd = "2.0.17"
tempfile = "3.19.1"
