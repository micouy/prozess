name: Version Guard

on:
  pull_request:
    branches:
      - master

jobs:
  require-version-bump:
    name: Require version bump
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check source changes
        id: changes
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^(src/|tests/|Cargo\.toml|Cargo\.lock)'; then
            echo "requires_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "requires_version=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare package versions
        if: steps.changes.outputs.requires_version == 'true'
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          base_version=$(git show "$base:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)
          head_version=$(git show "$head:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)

          echo "base version: $base_version"
          echo "head version: $head_version"

          if [[ "$base_version" == "$head_version" ]]; then
            echo "Source changes require a Cargo.toml version bump." >&2
            exit 1
          fi
